<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1f2937;
      transition: background 0.6s ease;
    }
    body.admin-mode {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    }
    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      padding: 44px 40px;
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      letter-spacing: 0.3px;
    }
    .badge.guest {
      background: #eef2ff;
      color: #4f46e5;
    }
    .badge.admin {
      background: #fff7e0;
      color: #b45309;
      box-shadow: 0 0 0 2px #fde68a inset;
    }
    .greeting {
      font-size: 30px;
      font-weight: 700;
      margin: 0 0 12px;
      line-height: 1.3;
      word-break: break-word;
    }
    .greeting .name {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    body.admin-mode .greeting .name {
      background: linear-gradient(135deg, #b45309, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .note {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 26px;
    }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    button.ghost {
      background: #f3f4f6;
      color: #4b5563;
    }
    button.ghost:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }
    button.ghost:active { transform: translateY(0); }
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      .greeting { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="badge" class="badge guest">👤 访客</div>

    <p class="greeting">你好，<span class="name" id="name"></span></p>
    <p class="note" id="note"></p>

    <button class="ghost" id="change">换个昵称</button>
  </div>

  <script src="./js/nickname.js"></script>
  <script>
    const name = Nick.getNickname()
    if (!name) {
      location.href = './index.html'
    }

    const admin = Nick.isAdmin()

    if (admin) {
      document.body.classList.add('admin-mode')
      document.getElementById('badge').className = 'badge admin'
      document.getElementById('badge').textContent = '👑 管理员'
      document.getElementById('note').textContent = '欢迎回来，管理员。这里有你的专属页面。'
    } else {
      document.getElementById('note').textContent = '很高兴见到你，随便逛逛吧。'
    }

    document.getElementById('name').textContent = name

    document.getElementById('change').addEventListener('click', function () {
      Nick.clearNickname()
      location.href = './index.html'
    })
  </script>
</body>
</html>
