<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1f2937;
    }
    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      padding: 44px 40px;
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .subtitle {
      color: #6b7280;
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.18);
    }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 14px;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(102, 126, 234, 0.42);
      filter: brightness(1.05);
    }
    button:active { transform: translateY(0); }
    #msg {
      color: #dc2626;
      font-size: 14px;
      margin-top: 16px;
      min-height: 20px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>欢迎</h1>
    <p class="subtitle">输入一个昵称，就可以进入主页。</p>

    <form id="form">
      <input name="nickname" placeholder="你的昵称" required maxlength="20" autocomplete="off">
      <button type="submit">进入主页</button>
    </form>

    <p id="msg"></p>
  </div>

  <script src="./js/nickname.js"></script>
  <script>
    const form = document.getElementById('form')
    const msg = document.getElementById('msg')
    const input = form.querySelector('input')

    const old = Nick.getNickname()
    if (old) {
      input.value = old
      msg.style.color = '#6b7280'
      msg.textContent = '欢迎回来，' + old + '。直接点按钮进入主页。'
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault()
      const name = input.value.trim()
      if (!name) {
        msg.style.color = '#dc2626'
        msg.textContent = '昵称不能为空'
        return
      }
      Nick.setNickname(name)
      location.href = './home.html'
    })
  </script>
</body>
</html>
